<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="100%" height="150">
  <defs>
    <!-- Dark Card Background -->
    <linearGradient id="trophyBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#070c14" />
    </linearGradient>

    <!-- Gold Medal Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- Diamond Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Emerald Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Purple Master Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="trophyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&amp;family=Inter:wght@600;700;800&amp;display=swap');

      .trophy-title {
        font-family: 'Inter', sans-serif;
        font-size: 11px;
        font-weight: 700;
        fill: #8b949e;
      }

      .trophy-rank {
        font-family: 'Orbitron', sans-serif;
        font-size: 16px;
        font-weight: 900;
        fill: #f0f6fc;
      }

      .trophy-sub {
        font-family: 'Inter', sans-serif;
        font-size: 9.5px;
        font-weight: 600;
        fill: #cbd5e1;
      }

      @keyframes medalShine {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }

      .shine-card {
        animation: medalShine 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1000" height="150" rx="12" fill="url(#trophyBg)" stroke="#30363d" stroke-width="1.5" />

  <!-- 7 TROPHY BADGES IN A ROW -->
  <g transform="translate(15, 18)">
    
    <!-- TROPHY 1: COMMITS (Rank: S - Gold) -->
    <g transform="translate(0, 0)" class="shine-card">
      <rect width="130" height="114" rx="8" fill="#161b22" stroke="#eab308" stroke-width="1.2" />
      <circle cx="65" cy="38" r="22" fill="#0d1117" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#trophyGlow)" />
      <!-- Trophy Icon Emblem -->
      <path d="M 57,30 L 73,30 L 71,44 C 71,48 59,48 59,44 Z M 55,32 L 51,32 C 49,32 49,38 53,38 L 56,38 M 75,32 L 79,32 C 81,32 81,38 77,38 L 74,38 M 65,46 L 65,51 M 58,51 L 72,51" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" />
      <text x="65" y="74" text-anchor="middle" class="trophy-title">COMMITS</text>
      <text x="65" y="92" text-anchor="middle" class="trophy-rank" fill="#facc15">S</text>
      <text x="65" y="104" text-anchor="middle" class="trophy-sub">2,100+ Total</text>
    </g>

    <!-- TROPHY 2: REPOSITORIES (Rank: A - Cyan) -->
    <g transform="translate(140, 0)">
      <rect width="130" height="114" rx="8" fill="#161b22" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="65" cy="38" r="22" fill="#0d1117" stroke="url(#cyanGrad)" stroke-width="2.5" filter="url(#trophyGlow)" />
      <path d="M 54,32 L 65,26 L 76,32 L 76,44 L 65,50 L 54,44 Z M 54,32 L 65,38 L 76,32 M 65,38 L 65,50" stroke="url(#cyanGrad)" stroke-width="1.5" fill="none" />
      <text x="65" y="74" text-anchor="middle" class="trophy-title">REPOS</text>
      <text x="65" y="92" text-anchor="middle" class="trophy-rank" fill="#38bdf8">A</text>
      <text x="65" y="104" text-anchor="middle" class="trophy-sub">12+ Projects</text>
    </g>

    <!-- TROPHY 3: PULL REQUESTS (Rank: A - Emerald) -->
    <g transform="translate(280, 0)" class="shine-card">
      <rect width="130" height="114" rx="8" fill="#161b22" stroke="#10b981" stroke-width="1.2" />
      <circle cx="65" cy="38" r="22" fill="#0d1117" stroke="url(#greenGrad)" stroke-width="2.5" filter="url(#trophyGlow)" />
      <circle cx="58" cy="32" r="3.5" stroke="url(#greenGrad)" stroke-width="1.5" fill="none" />
      <circle cx="58" cy="46" r="3.5" stroke="url(#greenGrad)" stroke-width="1.5" fill="none" />
      <circle cx="72" cy="38" r="3.5" stroke="url(#greenGrad)" stroke-width="1.5" fill="none" />
      <path d="M 58,35.5 L 58,42.5 M 58,35.5 C 58,40 72,34 72,35.5" stroke="url(#greenGrad)" stroke-width="1.5" fill="none" />
      <text x="65" y="74" text-anchor="middle" class="trophy-title">PULL REQUESTS</text>
      <text x="65" y="92" text-anchor="middle" class="trophy-rank" fill="#00ea64">A</text>
      <text x="65" y="104" text-anchor="middle" class="trophy-sub">Merged &amp; Active</text>
    </g>

    <!-- TROPHY 4: STARS (Rank: S - Gold) -->
    <g transform="translate(420, 0)">
      <rect width="130" height="114" rx="8" fill="#161b22" stroke="#eab308" stroke-width="1.2" />
      <circle cx="65" cy="38" r="22" fill="#0d1117" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#trophyGlow)" />
      <polygon points="65,28 68,35 76,35 70,40 72,48 65,43 58,48 60,40 54,35 62,35" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
      <text x="65" y="74" text-anchor="middle" class="trophy-title">STARS</text>
      <text x="65" y="92" text-anchor="middle" class="trophy-rank" fill="#facc15">S</text>
      <text x="65" y="104" text-anchor="middle" class="trophy-sub">42+ Earned</text>
    </g>

    <!-- TROPHY 5: ALGORITHMS (Rank: S - Purple) -->
    <g transform="translate(560, 0)" class="shine-card">
      <rect width="130" height="114" rx="8" fill="#161b22" stroke="#a855f7" stroke-width="1.2" />
      <circle cx="65" cy="38" r="22" fill="#0d1117" stroke="url(#purpleGrad)" stroke-width="2.5" filter="url(#trophyGlow)" />
      <path d="M 54,42 L 62,30 L 70,42 L 76,34" stroke="url(#purpleGrad)" stroke-width="2" fill="none" stroke-linecap="round" />
      <text x="65" y="74" text-anchor="middle" class="trophy-title">PROBLEM SOLVING</text>
      <text x="65" y="92" text-anchor="middle" class="trophy-rank" fill="#c084fc">S</text>
      <text x="65" y="104" text-anchor="middle" class="trophy-sub">Top 5% LeetCode</text>
    </g>

    <!-- TROPHY 6: CLOUD & DEVOPS (Rank: A - Cyan) -->
    <g transform="translate(700, 0)">
      <rect width="130" height="114" rx="8" fill="#161b22" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="65" cy="38" r="22" fill="#0d1117" stroke="url(#cyanGrad)" stroke-width="2.5" filter="url(#trophyGlow)" />
      <path d="M 55,42 C 53,42 51,40 51,38 C 51,36 53,34 56,34 C 57,30 61,28 65,28 C 70,28 73,31 74,34 C 77,34 79,36 79,38 C 79,40 77,42 75,42 Z" stroke="url(#cyanGrad)" stroke-width="1.5" fill="none" />
      <text x="65" y="74" text-anchor="middle" class="trophy-title">CLOUD SCALE</text>
      <text x="65" y="92" text-anchor="middle" class="trophy-rank" fill="#38bdf8">A</text>
      <text x="65" y="104" text-anchor="middle" class="trophy-sub">99.9% Uptime</text>
    </g>

    <!-- TROPHY 7: CONTINUOUS FLOW (Rank: MAX - Emerald) -->
    <g transform="translate(840, 0)" class="shine-card">
      <rect width="130" height="114" rx="8" fill="#161b22" stroke="#10b981" stroke-width="1.2" />
      <circle cx="65" cy="38" r="22" fill="#0d1117" stroke="url(#greenGrad)" stroke-width="2.5" filter="url(#trophyGlow)" />
      <circle cx="65" cy="38" r="12" fill="none" stroke="url(#greenGrad)" stroke-width="2" stroke-dasharray="25 15" />
      <polygon points="63,33 69,38 63,43" fill="#00ea64" />
      <text x="65" y="74" text-anchor="middle" class="trophy-title">STREAK</text>
      <text x="65" y="92" text-anchor="middle" class="trophy-rank" fill="#00ea64">MAX</text>
      <text x="65" y="104" text-anchor="middle" class="trophy-sub">184+ Days Active</text>
    </g>

  </g>
</svg>
