<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495" height="195">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="statCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#070c14" />
    </linearGradient>

    <!-- Ring Rank Gradient -->
    <linearGradient id="rankRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f81f7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <filter id="rankGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&amp;family=Orbitron:wght@700;900&amp;display=swap');

      .card-title {
        font-family: 'Inter', sans-serif;
        font-size: 17px;
        font-weight: 700;
        fill: #2f81f7;
      }

      .stat-label {
        font-family: 'Inter', sans-serif;
        font-size: 13.5px;
        font-weight: 600;
        fill: #c9d1d9;
      }

      .stat-value {
        font-family: 'Inter', sans-serif;
        font-size: 13.5px;
        font-weight: 800;
        fill: #f0f6fc;
      }

      .rank-letter {
        font-family: 'Orbitron', 'Inter', sans-serif;
        font-size: 26px;
        font-weight: 900;
        fill: #38bdf8;
      }

      @keyframes rankPulse {
        0%, 100% { stroke-dashoffset: 0; }
        50% { stroke-dashoffset: 20; }
      }

      .ring-anim {
        animation: rankPulse 4s linear infinite;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="495" height="195" rx="10" fill="url(#statCardBg)" stroke="#30363d" stroke-width="1.5" />

  <!-- Title -->
  <g transform="translate(25, 34)">
    <text x="0" y="0" class="card-title">Aryan Anand's GitHub Stats (@AryanAnand-25raj)</text>
  </g>

  <!-- Stat Items (Left Column) -->
  <g transform="translate(25, 66)">
    
    <!-- Item 1: Total Public Repositories -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="0" r="3.5" fill="#2f81f7" />
      <text x="18" y="4" class="stat-label">Public Repositories:</text>
      <text x="210" y="4" class="stat-value">44 Repos</text>
    </g>

    <!-- Item 2: Total Stars Earned -->
    <g transform="translate(0, 26)">
      <circle cx="6" cy="0" r="3.5" fill="#e3b341" />
      <text x="18" y="4" class="stat-label">Total Stars Earned:</text>
      <text x="210" y="4" class="stat-value">10+ Stars</text>
    </g>

    <!-- Item 3: Featured Production Projects -->
    <g transform="translate(0, 52)">
      <circle cx="6" cy="0" r="3.5" fill="#00ea64" />
      <text x="18" y="4" class="stat-label">Production Deployments:</text>
      <text x="210" y="4" class="stat-value">ZYLO 3D, Resume, Notepad</text>
    </g>

    <!-- Item 4: Active Stacks -->
    <g transform="translate(0, 78)">
      <circle cx="6" cy="0" r="3.5" fill="#a855f7" />
      <text x="18" y="4" class="stat-label">Primary Frameworks:</text>
      <text x="210" y="4" class="stat-value">Python, TS, React, Cloud</text>
    </g>

    <!-- Item 5: Active Streak -->
    <g transform="translate(0, 104)">
      <circle cx="6" cy="0" r="3.5" fill="#38bdf8" />
      <text x="18" y="4" class="stat-label">Daily Engineering Flow:</text>
      <text x="210" y="4" class="stat-value">Active Daily ⚡</text>
    </g>

  </g>

  <!-- Rank Badge (Right Column) -->
  <g transform="translate(390, 105)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="46" fill="none" stroke="#161b22" stroke-width="6" />
    <circle cx="0" cy="0" r="46" fill="none" stroke="url(#rankRing)" stroke-width="6" stroke-dasharray="240 60" class="ring-anim" filter="url(#rankGlow)" />
    
    <!-- Inner Disk -->
    <circle cx="0" cy="0" r="38" fill="#070c14" stroke="#30363d" stroke-width="1.2" />

    <!-- Rank Letter Text -->
    <text x="0" y="8" text-anchor="middle" class="rank-letter">A+</text>
    <text x="0" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#8b949e">TOP 5%</text>
  </g>
</svg>
