<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (RTL Direction) -->
    <linearGradient id="bgDarkGradientRTL" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#02040b" stop-opacity="0.98" />
      <stop offset="25%" stop-color="#090518" stop-opacity="1" />
      <stop offset="75%" stop-color="#090518" stop-opacity="1" />
      <stop offset="100%" stop-color="#02040b" stop-opacity="0.98" />
    </linearGradient>

    <!-- Speed Streaks (Reversed Direction) -->
    <linearGradient id="magentaStreakRTL" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0" />
      <stop offset="30%" stop-color="#ff007f" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cyanStreakRTL" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="40%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="jetTrailStreamRTL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="20%" stop-color="#ff007f" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#00f2fe" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </linearGradient>

    <filter id="intenseNeonRTL" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="laserGlowRTL" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes runnerMoveRTL {
      0% { transform: translateX(1180px); }
      100% { transform: translateX(-380px); }
    }
    @keyframes boardHoverBounceRTL {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-5px) rotate(-1.5deg); }
      75% { transform: translateY(4px) rotate(1deg); }
    }
    @keyframes speedLinesDashRTL {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 200; }
    }
    @keyframes pulseDebugTag {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; filter: drop-shadow(0 0 10px #22c55e); }
    }

    .coder-rtl-container {
      animation: runnerMoveRTL 5.2s linear infinite;
    }
    .hover-character-rtl {
      animation: boardHoverBounceRTL 1.1s ease-in-out infinite;
    }
    .speed-line-rtl {
      stroke-dasharray: 40 25;
      animation: speedLinesDashRTL 0.35s linear infinite;
    }
    .debug-text {
      font-family: 'Fira Code', monospace;
      font-weight: 700;
    }
    .tag-pulse {
      animation: pulseDebugTag 1.5s ease-in-out infinite;
    }
  </style>

  <!-- Background Base Container -->
  <rect width="1100" height="240" rx="16" fill="url(#bgDarkGradientRTL)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- High-Speed Horizontal Light Streaks & Beams (RTL) -->
  <g opacity="0.85">
    <line x1="0" y1="35" x2="1100" y2="35" stroke="url(#magentaStreakRTL)" stroke-width="2" class="speed-line-rtl" />
    <line x1="0" y1="65" x2="1100" y2="65" stroke="url(#cyanStreakRTL)" stroke-width="2.5" class="speed-line-rtl" style="animation-duration: 0.3s;" />
    <line x1="0" y1="185" x2="1100" y2="185" stroke="url(#magentaStreakRTL)" stroke-width="2.5" class="speed-line-rtl" />
    <line x1="0" y1="210" x2="1100" y2="210" stroke="url(#cyanStreakRTL)" stroke-width="1.8" class="speed-line-rtl" style="animation-duration: 0.4s;" />
  </g>

  <!-- Floating Holographic Debug Tags in Background (Matching Showcase Image) -->
  <g class="debug-text" opacity="0.8">
    <!-- Top Debug Indicators -->
    <text x="980" y="55" fill="#22c55e" font-size="14" class="tag-pulse" text-anchor="end">DEBUGGING... 🔍</text>
    <text x="960" y="80" fill="#38bdf8" font-size="12" text-anchor="end">variable_names</text>
    <text x="980" y="102" fill="#a855f7" font-size="12" text-anchor="end">$stack_trace</text>
    <text x="960" y="124" fill="#ff007f" font-size="12" text-anchor="end">'commit_changes'</text>

    <!-- Left Code Console Stream -->
    <text x="80" y="55" fill="#00f2fe" font-size="13">git console.log('Deploying...') ✨</text>
    <text x="60" y="105" fill="#ff007f" font-size="13">const main, =&gt; {</text>

    <!-- Floating Cute Bug & Checkmark Icons -->
    <g transform="translate(680, 70)">
      <!-- Green Checkmark Icon -->
      <rect x="0" y="0" width="22" height="22" rx="4" fill="#052e16" stroke="#22c55e" stroke-width="1.5" />
      <path d="M 5,11 L 9,15 L 17,7" stroke="#22c55e" stroke-width="2.5" fill="none" stroke-linecap="round" />
    </g>

    <g transform="translate(715, 65)">
      <!-- Cute Fleeing Green Bug -->
      <circle cx="8" cy="8" r="5" fill="#22c55e" filter="url(#intenseNeonRTL)" />
      <circle cx="16" cy="7" r="4" fill="#22c55e" />
      <line x1="8" y1="3" x2="6" y2="0" stroke="#22c55e" stroke-width="1.2" />
      <line x1="16" y1="3" x2="18" y2="0" stroke="#22c55e" stroke-width="1.2" />
      <circle cx="6" cy="7" r="1" fill="#ffffff" />
      <circle cx="14" cy="6" r="1" fill="#ffffff" />
    </g>

    <g transform="translate(680, 110)">
      <!-- Red Cross Badge -->
      <rect x="0" y="0" width="20" height="20" rx="4" fill="#3b0712" stroke="#ff0055" stroke-width="1.5" />
      <path d="M 6,6 L 14,14 M 14,6 L 6,14" stroke="#ff0055" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  <!-- ==================== ANIMATED CARTOON CODER PERSON (FACING LEFT) ==================== -->
  <g class="coder-rtl-container">
    
    <!-- Giant Glowing Plasma Jet Trail from Hoverboard (Trailing Right) -->
    <path d="M 180,185 L 380,175 L 260,190 L 420,195 L 180,198 Z" fill="url(#jetTrailStreamRTL)" filter="url(#laserGlowRTL)" />

    <!-- Road Surface Glow & Shadow -->
    <ellipse cx="145" cy="206" rx="90" ry="10" fill="#000000" opacity="0.9" />
    <ellipse cx="145" cy="204" rx="75" ry="5" fill="#ff007f" opacity="0.4" filter="url(#intenseNeonRTL)" />

    <!-- Animated Hovering Character & Board (Facing Left) -->
    <g class="hover-character-rtl">
      
      <!-- ==================== CYBER HOVERBOARD (FACING LEFT) ==================== -->
      <g id="cyberHoverboardRTL">
        <!-- Bottom Jet Thrusters -->
        <ellipse cx="195" cy="195" rx="14" ry="4" fill="#ff007f" filter="url(#intenseNeonRTL)" />
        <ellipse cx="95" cy="195" rx="14" ry="4" fill="#00f2fe" filter="url(#intenseNeonRTL)" />
        
        <!-- Main Sculpted Curved Deck (Facing Left) -->
        <path d="M 235,188 C 190,180 100,180 55,188 L 62,198 C 105,192 185,192 228,198 Z" 
              fill="#0f172a" 
              stroke="#ff007f" 
              stroke-width="1.8" 
              filter="url(#intenseNeonRTL)" />

        <!-- Neon Cyan & Magenta Deck Edge Lighting -->
        <path d="M 222,193 Q 145,186 68,193" stroke="#00f2fe" stroke-width="2.5" fill="none" filter="url(#intenseNeonRTL)" />
        <circle cx="145" cy="190" r="3" fill="#ffffff" />
      </g>

      <!-- ==================== CARTOON CODER CHARACTER (FACING LEFT) ==================== -->
      <g id="stylizedDeveloperRTL">
        
        <!-- Backpack (Facing Left) -->
        <path d="M 205,115 C 215,115 222,125 222,145 C 222,160 212,170 200,170 Z" fill="#0b1329" stroke="#ff007f" stroke-width="1.2" />
        <line x1="204" y1="125" x2="182" y2="135" stroke="#ff007f" stroke-width="2" />

        <!-- Right Leg & Back Sneaker -->
        <path d="M 188,150 L 198,175 L 184,186 L 172,186 L 178,170 L 172,150 Z" fill="#090d18" stroke="#1e293b" stroke-width="1" />
        <ellipse cx="190" cy="186" rx="14" ry="6" fill="#1e293b" stroke="#7928ca" stroke-width="1.5" />
        <line x1="202" y1="190" x2="178" y2="190" stroke="#7928ca" stroke-width="2" filter="url(#intenseNeonRTL)" />

        <!-- Left Leg & Front Sneaker (Facing Left) -->
        <path d="M 142,150 L 118,172 L 100,186 L 86,186 L 104,168 L 124,150 Z" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <ellipse cx="94" cy="186" rx="14" ry="6" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5" />
        <line x1="106" y1="190" x2="82" y2="190" stroke="#00f2fe" stroke-width="2" filter="url(#intenseNeonRTL)" />

        <!-- Dark Tech Hoodie Torso (Facing Left) -->
        <path d="M 195,115 C 200,85 170,75 135,80 C 115,85 110,110 120,150 C 150,155 175,155 195,150 Z" 
              fill="#0f172a" 
              stroke="#ff007f" 
              stroke-width="1.5" />

        <!-- Hoodie Neon Seam Lines -->
        <path d="M 165,80 L 172,140 M 145,82 L 138,140" stroke="#ff007f" stroke-width="1.4" opacity="0.8" />

        <!-- Developer Arms: Left Hand Holding Coffee Cup, Right Hand Typing on Laptop -->
        <!-- Coffee Arm (Right Arm extended back/center holding cup) -->
        <path d="M 170,95 Q 185,110 188,126" stroke="#0f172a" stroke-width="12" stroke-linecap="round" />
        <!-- Steaming Coffee Mug in Hand (Matching Showcase Image) -->
        <g transform="translate(182, 118)">
          <rect x="0" y="0" width="14" height="18" rx="3" fill="#ffffff" stroke="#ff007f" stroke-width="1.2" />
          <path d="M 14,4 Q 19,8 14,13" stroke="#ff007f" stroke-width="1.2" fill="none" />
          <!-- Hand Fingers wrapping cup -->
          <ellipse cx="4" cy="10" rx="3" ry="5" fill="#fed7aa" stroke="#0f172a" stroke-width="0.8" />
          <!-- Coffee Steam -->
          <path d="M 4,-3 Q 7,-7 4,-11 M 9,-3 Q 12,-7 9,-11" stroke="#00f2fe" stroke-width="1.2" stroke-linecap="round" />
        </g>

        <!-- Left Arm: Extended forward to Laptop -->
        <path d="M 155,95 Q 125,105 112,125" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />
        <ellipse cx="86" cy="124" rx="4" ry="3" fill="#fed7aa" stroke="#ff007f" stroke-width="0.8" />

        <!-- Glowing Holographic Laptop (Facing Left) -->
        <polygon points="105,126 52,120 60,132 114,132" fill="#1e293b" stroke="#ff007f" stroke-width="1.2" />
        <line x1="102" y1="129" x2="62" y2="125" stroke="#ff007f" stroke-width="1.5" stroke-dasharray="3 2" />

        <!-- Holographic Screen (Facing Left) -->
        <g class="tag-pulse">
          <polygon points="78,82 36,84 52,120 82,118" fill="rgba(0, 242, 254, 0.75)" stroke="#00f2fe" stroke-width="1.8" filter="url(#intenseNeonRTL)" />
          <circle cx="60" cy="100" r="3.5" fill="#ffffff" filter="url(#intenseNeonRTL)" />

          <!-- Projected Floating Hologram Code Window in Air -->
          <g transform="translate(0, 45)">
            <rect x="0" y="0" width="75" height="42" rx="4" fill="rgba(4, 12, 30, 0.88)" stroke="#ff007f" stroke-width="1.2" filter="url(#intenseNeonRTL)" />
            <line x1="6" y1="10" x2="68" y2="10" stroke="#00f2fe" stroke-width="1.5" />
            <line x1="6" y1="18" x2="52" y2="18" stroke="#ff007f" stroke-width="1.5" />
            <line x1="6" y1="26" x2="62" y2="26" stroke="#22c55e" stroke-width="1.5" />
            <line x1="6" y1="34" x2="40" y2="34" stroke="#38bdf8" stroke-width="1.5" />
          </g>
        </g>

        <!-- Developer Head & Face (Facing Left) -->
        <rect x="144" y="66" width="14" height="12" fill="#fed7aa" />
        <path d="M 170,55 C 170,30 145,26 130,35 C 122,40 120,50 124,62 C 134,72 156,70 170,55 Z" fill="#fed7aa" stroke="#334155" stroke-width="1" />
        
        <!-- Hair (Facing Left) -->
        <path d="M 178,48 C 180,22 155,15 135,20 C 122,24 118,38 124,48 C 132,34 155,28 178,48 Z" fill="#0f172a" stroke="#ff007f" stroke-width="1" />
        <polygon points="155,18 146,8 140,20" fill="#0f172a" />
        <polygon points="140,20 130,10 125,24" fill="#0f172a" />
        <polygon points="172,26 164,14 156,25" fill="#0f172a" />

        <!-- Coder Eye & Smile (Facing Left) -->
        <path d="M 142,44 Q 132,42 128,46" stroke="#0f172a" stroke-width="2" fill="none" />
        <circle cx="134" cy="48" r="3.5" fill="#040814" stroke="#ff007f" stroke-width="1" filter="url(#intenseNeonRTL)" />
        <circle cx="133" cy="47" r="1.2" fill="#ffffff" />
        <path d="M 140,58 Q 134,62 128,57" stroke="#0f172a" stroke-width="1.5" fill="none" />

        <!-- Gaming Headphones (Facing Left) -->
        <path d="M 175,50 Q 178,24 154,24 Q 135,24 135,42" fill="none" stroke="#7928ca" stroke-width="4" />
        <rect x="168" y="42" width="10" height="18" rx="4" fill="#00f2fe" stroke="#ffffff" stroke-width="1" filter="url(#intenseNeonRTL)" />
        <circle cx="173" cy="51" r="2.5" fill="#ff007f" />
      </g>
    </g>
  </g>
</svg>
