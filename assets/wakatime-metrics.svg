<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="wakaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Glowing Progress Bar Gradients -->
    <linearGradient id="barPy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="barTs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="barGo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <linearGradient id="barK8s" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ea64" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="wakaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&amp;family=Fira+Code:wght@500;600;700&amp;display=swap');

      .waka-title {
        font-family: 'Orbitron', sans-serif;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 1.5px;
        fill: #f0f6fc;
      }

      .waka-label {
        font-family: 'Fira Code', monospace;
        font-size: 12px;
        font-weight: 600;
        fill: #cbd5e1;
      }

      .waka-time {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        font-weight: 500;
        fill: #8b949e;
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1000" height="240" rx="14" fill="url(#wakaBg)" stroke="#30363d" stroke-width="1.5" />

  <!-- Top Title Header -->
  <g transform="translate(35, 35)">
    <circle cx="6" cy="0" r="4.5" fill="#38bdf8" />
    <text x="20" y="5" class="waka-title">WEEKLY CODING ACTIVITY &amp; FOCUS METRICS</text>
    <text x="460" y="5" font-family="'Fira Code', monospace" font-size="11.5" fill="#00ea64">[ 48 hrs 20 mins tracked this week ]</text>
  </g>

  <!-- Progress Columns Grid -->
  <g transform="translate(35, 75)">
    
    <!-- Row 1: Python (Backend & AI) -->
    <g transform="translate(0, 0)">
      <text x="0" y="12" class="waka-label">Python (AI &amp; Microservices)</text>
      <text x="420" y="12" class="waka-time">21 hrs 45 mins <tspan fill="#38bdf8" font-weight="700">(45%)</tspan></text>
      <!-- Track Background -->
      <rect x="0" y="20" width="440" height="8" rx="4" fill="#161b22" />
      <!-- Fill -->
      <rect x="0" y="20" width="198" height="8" rx="4" fill="url(#barPy)" filter="url(#wakaGlow)" />
    </g>

    <!-- Row 2: TypeScript & React (Frontend UI) -->
    <g transform="translate(0, 48)">
      <text x="0" y="12" class="waka-label">TypeScript &amp; React (UI/UX)</text>
      <text x="420" y="12" class="waka-time">11 hrs 30 mins <tspan fill="#facc15" font-weight="700">(24%)</tspan></text>
      <rect x="0" y="20" width="440" height="8" rx="4" fill="#161b22" />
      <rect x="0" y="20" width="105" height="8" rx="4" fill="url(#barTs)" filter="url(#wakaGlow)" />
    </g>

    <!-- Row 3: Go & C++ (Systems & CP) -->
    <g transform="translate(0, 96)">
      <text x="0" y="12" class="waka-label">Go &amp; C++ (Systems / DSA)</text>
      <text x="420" y="12" class="waka-time">8 hrs 50 mins <tspan fill="#a855f7" font-weight="700">(18%)</tspan></text>
      <rect x="0" y="20" width="440" height="8" rx="4" fill="#161b22" />
      <rect x="0" y="20" width="79" height="8" rx="4" fill="url(#barGo)" filter="url(#wakaGlow)" />
    </g>

    <!-- Column 2 (Right Side): Editors, Tools & Telemetry -->
    <g transform="translate(510, 0)">
      
      <!-- Box 1: Primary IDE / Editor -->
      <rect width="200" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="18" y="24" class="waka-label" fill="#f0f6fc">💻 Primary IDE</text>
      <text x="18" y="44" class="waka-time">VS Code &amp; Neovim (85%)</text>

      <!-- Box 2: Primary OS -->
      <rect x="220" width="200" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="238" y="24" class="waka-label" fill="#f0f6fc">🐧 Primary OS</text>
      <text x="238" y="44" class="waka-time">Arch Linux / Ubuntu (92%)</text>

      <!-- Box 3: Cloud & Containers -->
      <rect y="70" width="420" height="54" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="18" y="93" class="waka-label" fill="#38bdf8">⚡ Cloud Deployments: <tspan fill="#f0f6fc">AWS ECS, GCP Cloud Run, Docker Compose</tspan></text>
      <text x="18" y="112" class="waka-time">Automated GitHub Actions CI/CD Pipeline Enabled</text>
    </g>

  </g>
</svg>
