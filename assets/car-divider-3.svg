<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 150" width="100%" height="100%">
  <defs>
    <linearGradient id="divBg3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#02040a" stop-opacity="0" />
      <stop offset="25%" stop-color="#05172e" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#05172e" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#02040a" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="warpRingGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="porscheMachBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#071120" />
      <stop offset="25%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#071120" />
    </linearGradient>

    <filter id="hyperGlow3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes machSpeedPorsche {
      0% { transform: translateY(-80px) scale(0.7); opacity: 0; }
      15% { opacity: 1; }
      70% { transform: translateY(60px) scale(1.05); }
      100% { transform: translateY(180px) scale(1.15); opacity: 0; }
    }
    @keyframes shockwaveExpand {
      0% { transform: scale(0.2); opacity: 1; }
      100% { transform: scale(2.4); opacity: 0; }
    }
    @keyframes warpRays {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    .warp-ray-line {
      stroke-dasharray: 40 80;
      animation: warpRays 0.3s linear infinite;
    }
    .mach-porsche {
      animation: machSpeedPorsche 2.0s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      transform-origin: 460px 75px;
    }
    .shockwave-ring {
      animation: shockwaveExpand 2.0s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
      transform-origin: 460px 75px;
    }
    .hud-text-3 {
      font-family: 'Orbitron', 'Segoe UI', monospace;
      font-size: 10px;
      letter-spacing: 2.5px;
      font-weight: 700;
    }
  </style>

  <!-- Background Base -->
  <rect width="920" height="150" fill="url(#divBg3)" rx="12"/>

  <!-- High-Speed Warp Streamlines -->
  <g stroke="#00f2fe" opacity="0.65" class="warp-ray-line">
    <line x1="180" y1="0" x2="180" y2="150" stroke-width="1.5" />
    <line x1="280" y1="0" x2="280" y2="150" stroke-width="2.5" stroke="#38bdf8" />
    <line x1="390" y1="0" x2="390" y2="150" stroke-width="3" stroke="#ffffff" />
    <line x1="530" y1="0" x2="530" y2="150" stroke-width="3" stroke="#ffffff" />
    <line x1="640" y1="0" x2="640" y2="150" stroke-width="2.5" stroke="#38bdf8" />
    <line x1="740" y1="0" x2="740" y2="150" stroke-width="1.5" />
  </g>

  <!-- Sonic Boom Shockwave Rings -->
  <ellipse cx="460" cy="75" rx="90" ry="25" fill="none" stroke="#00f2fe" stroke-width="2" class="shockwave-ring" filter="url(#hyperGlow3)"/>
  <ellipse cx="460" cy="75" rx="90" ry="25" fill="none" stroke="#6366f1" stroke-width="1.5" class="shockwave-ring" style="animation-delay: -1.0s;" filter="url(#hyperGlow3)"/>

  <!-- HUD Telemetry Track Borders -->
  <line x1="50" y1="20" x2="870" y2="20" stroke="#38bdf8" stroke-width="1.6" opacity="0.8"/>
  <line x1="50" y1="130" x2="870" y2="130" stroke="#38bdf8" stroke-width="1.6" opacity="0.8"/>

  <text x="70" y="80" fill="#38bdf8" class="hud-text-3">&gt;&gt; STAGE 03 // PORSCHE 911 WARP ACCELERATION</text>
  <text x="850" y="80" text-anchor="end" fill="#00f2fe" class="hud-text-3">&gt;&gt; MACH VELOCITY TELEMETRY &gt;&gt;</text>

  <!-- Supercharged Mach Porsche 911 (Top Down Heading Downward) -->
  <g class="mach-porsche">
    <!-- Plasma Hyperspace Tail -->
    <path d="M 440,-50 L 460,20 L 480,-50 Z" fill="url(#warpRingGrad)" filter="url(#hyperGlow3)"/>
    <line x1="460" y1="-90" x2="460" y2="30" stroke="#ffffff" stroke-width="3.5" filter="url(#hyperGlow3)"/>

    <!-- Car Body -->
    <path d="M 460,-40 
             C 472,-40 480,-30 482,-16 
             C 484,-2 478,6 484,18 
             C 487,24 485,36 478,42 
             C 470,46 450,46 442,42 
             C 435,36 433,24 436,18 
             C 442,6 436,-2 438,-16 
             C 440,-30 448,-40 460,-40 Z" 
          fill="url(#porscheMachBody)" stroke="#00f2fe" stroke-width="2" filter="url(#hyperGlow3)"/>
    
    <!-- Windshield -->
    <path d="M 460,-22 C 468,-22 472,-14 471,-2 C 470,10 468,16 460,18 C 452,16 450,10 449,-2 C 448,-14 452,-22 460,-22 Z" fill="#020c1b" stroke="#38bdf8" stroke-width="1"/>

    <!-- Matrix 4-Point Forward Beam -->
    <circle cx="448" cy="-32" r="2.5" fill="#ffffff" filter="url(#hyperGlow3)"/>
    <circle cx="472" cy="-32" r="2.5" fill="#ffffff" filter="url(#hyperGlow3)"/>
    <!-- Rear Continuous Red/Magenta Lightbar -->
    <path d="M 444,40 Q 460,43 476,40" stroke="#ff007f" stroke-width="2.5" fill="none" filter="url(#hyperGlow3)"/>
  </g>
</svg>
