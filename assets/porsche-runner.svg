<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" width="100%" height="100%">
  <defs>
    <!-- Professional Obsidian & Navy Background -->
    <linearGradient id="proBgLTR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090d16" stop-opacity="0.98" />
      <stop offset="25%" stop-color="#0d1527" stop-opacity="1" />
      <stop offset="75%" stop-color="#0d1527" stop-opacity="1" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.98" />
    </linearGradient>

    <!-- Professional Tech Gradients (Sapphire, Indigo, Emerald) -->
    <linearGradient id="sapphireBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="85%" stop-color="#2563eb" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="indigoBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0" />
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.85" />
      <stop offset="80%" stop-color="#4f46e5" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="emeraldBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>

    <!-- Character & Board Shaders -->
    <linearGradient id="proJacket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="proBoardDeck" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="30%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="proHoloScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#2563eb" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="proJetTrail" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="1" />
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </linearGradient>

    <!-- Refined Glow Filters -->
    <filter id="proGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="proLaserGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes runnerMoveLTR {
      0% { transform: translateX(-380px); }
      100% { transform: translateX(1180px); }
    }
    @keyframes boardHoverBounce {
      0%, 100% { transform: translateY(0px); }
      25% { transform: translateY(-4px); }
      75% { transform: translateY(3px); }
    }
    @keyframes speedLinesDash {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -200; }
    }
    .coder-ltr-container {
      animation: runnerMoveLTR 5.5s linear infinite;
    }
    .hover-character {
      animation: boardHoverBounce 1.2s ease-in-out infinite;
    }
    .speed-line {
      stroke-dasharray: 45 30;
      animation: speedLinesDash 0.4s linear infinite;
    }
    .syntax-code {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Fira Code", monospace;
      font-weight: 600;
    }
  </style>

  <!-- Background Base Container -->
  <rect width="1100" height="240" rx="14" fill="url(#proBgLTR)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- High-Speed Horizontal Light Streaks & Beams -->
  <g opacity="0.75">
    <line x1="0" y1="35" x2="1100" y2="35" stroke="url(#sapphireBeam)" stroke-width="1.8" class="speed-line">
      <animate attributeName="stroke-dashoffset" from="0" to="-200" dur="0.4s" repeatCount="indefinite" />
    </line>
    <line x1="0" y1="65" x2="1100" y2="65" stroke="url(#indigoBeam)" stroke-width="2.2" class="speed-line">
      <animate attributeName="stroke-dashoffset" from="0" to="-200" dur="0.35s" repeatCount="indefinite" />
    </line>
    <line x1="0" y1="185" x2="1100" y2="185" stroke="url(#sapphireBeam)" stroke-width="2.2" class="speed-line">
      <animate attributeName="stroke-dashoffset" from="0" to="-200" dur="0.4s" repeatCount="indefinite" />
    </line>
    <line x1="0" y1="210" x2="1100" y2="210" stroke="url(#emeraldBeam)" stroke-width="1.6" class="speed-line">
      <animate attributeName="stroke-dashoffset" from="0" to="-200" dur="0.45s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Floating Code Tags in Background -->
  <g class="syntax-code">
    <text x="80" y="55" fill="#38bdf8" font-size="13">&lt;script&gt;</text>
    <text x="520" y="50" fill="#34d399" font-size="13">console.log('Deploying...') 🚀</text>
    <text x="960" y="55" fill="#818cf8" font-size="13" text-anchor="end">{ ... }</text>

    <text x="60" y="105" fill="#60a5fa" font-size="12">const main {</text>
    <text x="880" y="105" fill="#38bdf8" font-size="12" text-anchor="end">'commit_changes'</text>

    <!-- Bottom Tech Tags -->
    <text x="450" y="215" fill="#60a5fa" font-size="13" font-weight="600">npm , git , docker , k8s =&gt;</text>
  </g>

  <!-- ==================== PROFESSIONAL CARTOON CODER PERSON (FACING RIGHT) ==================== -->
  <g class="coder-ltr-container">
    <!-- Native SMIL + CSS double transform -->
    <animateTransform attributeName="transform" type="translate" from="-380 0" to="1180 0" dur="5.5s" repeatCount="indefinite" />
    
    <!-- Glowing Sapphire Jet Trail from Hoverboard -->
    <path d="M 120,185 L -80,175 L 40,190 L -120,195 L 120,198 Z" fill="url(#proJetTrail)" filter="url(#proLaserGlow)" />

    <!-- Road Surface Glow & Shadow -->
    <ellipse cx="185" cy="206" rx="90" ry="10" fill="#000000" opacity="0.9" />
    <ellipse cx="185" cy="204" rx="75" ry="5" fill="#38bdf8" opacity="0.35" filter="url(#proGlow)" />

    <!-- Animated Hovering Character & Board -->
    <g class="hover-character">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,3; 0,0" keyTimes="0; 0.25; 0.75; 1" dur="1.2s" repeatCount="indefinite" />
      
      <!-- ==================== CYBER HOVERBOARD ==================== -->
      <g id="cyberHoverboardLTR">
        <!-- Bottom Jet Thrusters -->
        <ellipse cx="135" cy="195" rx="14" ry="4" fill="#38bdf8" filter="url(#proGlow)" />
        <ellipse cx="235" cy="195" rx="14" ry="4" fill="#6366f1" filter="url(#proGlow)" />
        
        <!-- Main Sculpted Curved Deck -->
        <path d="M 95,188 C 140,180 230,180 275,188 L 268,198 C 225,192 145,192 102,198 Z" 
              fill="url(#proBoardDeck)" 
              stroke="#38bdf8" 
              stroke-width="1.6" 
              filter="url(#proGlow)" />

        <!-- Sapphire & Indigo Deck Edge Lighting -->
        <path d="M 108,193 Q 185,186 262,193" stroke="#60a5fa" stroke-width="2.2" fill="none" filter="url(#proGlow)" />
        <circle cx="185" cy="190" r="3" fill="#f8fafc" />
      </g>

      <!-- ==================== CARTOON CODER CHARACTER ==================== -->
      <g id="stylizedDeveloperLTR">
        
        <!-- Tech Backpack -->
        <path d="M 125,115 C 115,115 108,125 108,145 C 108,160 118,170 130,170 Z" fill="#0b1329" stroke="#38bdf8" stroke-width="1.2" />
        <line x1="126" y1="125" x2="148" y2="135" stroke="#38bdf8" stroke-width="1.8" />

        <!-- Left Leg & Back Sneaker -->
        <path d="M 142,150 L 132,175 L 146,186 L 158,186 L 152,170 L 158,150 Z" fill="#090d18" stroke="#1e293b" stroke-width="1" />
        <ellipse cx="140" cy="186" rx="14" ry="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.4" />
        <line x1="128" y1="190" x2="152" y2="190" stroke="#38bdf8" stroke-width="1.8" filter="url(#proGlow)" />

        <!-- Right Leg & Front Sneaker -->
        <path d="M 188,150 L 212,172 L 230,186 L 244,186 L 226,168 L 206,150 Z" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <ellipse cx="236" cy="186" rx="14" ry="6" fill="#1e293b" stroke="#60a5fa" stroke-width="1.4" />
        <line x1="224" y1="190" x2="248" y2="190" stroke="#60a5fa" stroke-width="1.8" filter="url(#proGlow)" />

        <!-- Dark Tech Hoodie / Torso -->
        <path d="M 135,115 C 130,85 160,75 195,80 C 215,85 220,110 210,150 C 180,155 155,155 135,150 Z" 
              fill="url(#proJacket)" 
              stroke="#38bdf8" 
              stroke-width="1.4" />

        <!-- Hoodie Seam Lines -->
        <path d="M 165,80 L 158,140 M 185,82 L 192,140" stroke="#38bdf8" stroke-width="1.2" opacity="0.75" />

        <!-- Developer Arms & Hands Typing -->
        <path d="M 175,95 Q 205,105 218,125" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />
        <path d="M 175,95 Q 205,105 218,125" stroke="#38bdf8" stroke-width="1.2" fill="none" />

        <!-- Forearm & Typing Hands -->
        <g class="typing-fingers">
          <path d="M 218,125 L 242,122 M 218,128 L 245,126" stroke="#fed7aa" stroke-width="4.5" stroke-linecap="round" />
          <circle cx="244" cy="122" r="3" fill="#fed7aa" stroke="#38bdf8" stroke-width="0.8" />
          <circle cx="247" cy="126" r="3" fill="#fed7aa" stroke="#38bdf8" stroke-width="0.8" />
        </g>

        <!-- Professional Matte Laptop -->
        <polygon points="225,126 278,120 270,132 216,132" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
        <line x1="228" y1="129" x2="268" y2="125" stroke="#38bdf8" stroke-width="1.4" stroke-dasharray="3 2" />

        <!-- Holographic Illuminated Display Screen -->
        <g class="screen-holo">
          <polygon points="252,82 294,84 278,120 248,118" fill="url(#proHoloScreen)" stroke="#38bdf8" stroke-width="1.6" filter="url(#proGlow)" />
          <circle cx="270" cy="100" r="3.5" fill="#f8fafc" filter="url(#proGlow)" />

          <!-- Projected Floating Hologram Code Window in Air -->
          <g transform="translate(255, 45)">
            <rect x="0" y="0" width="75" height="42" rx="4" fill="rgba(6, 13, 29, 0.88)" stroke="#38bdf8" stroke-width="1.2" filter="url(#proGlow)" />
            <line x1="6" y1="10" x2="68" y2="10" stroke="#38bdf8" stroke-width="1.4" />
            <line x1="6" y1="18" x2="52" y2="18" stroke="#60a5fa" stroke-width="1.4" />
            <line x1="6" y1="26" x2="62" y2="26" stroke="#34d399" stroke-width="1.4" />
            <line x1="6" y1="34" x2="40" y2="34" stroke="#818cf8" stroke-width="1.4" />
          </g>
        </g>

        <!-- Developer Head & Face -->
        <rect x="172" y="66" width="14" height="12" fill="#fed7aa" />
        <path d="M 160,55 C 160,30 185,26 200,35 C 208,40 210,50 206,62 C 196,72 174,70 160,55 Z" fill="#fed7aa" stroke="#334155" stroke-width="1" />
        
        <!-- Modern Hair -->
        <path d="M 152,48 C 150,22 175,15 195,20 C 208,24 212,38 206,48 C 198,34 175,28 152,48 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" />
        <polygon points="175,18 184,8 190,20" fill="#0f172a" />
        <polygon points="190,20 200,10 205,24" fill="#0f172a" />
        <polygon points="158,26 166,14 174,25" fill="#0f172a" />

        <!-- Coder Eye & Smile -->
        <path d="M 188,44 Q 198,42 202,46" stroke="#0f172a" stroke-width="1.5" fill="none" />
        <circle cx="196" cy="48" r="3.5" fill="#040814" stroke="#38bdf8" stroke-width="1" filter="url(#proGlow)" />
        <circle cx="197" cy="47" r="1.2" fill="#f8fafc" />
        <path d="M 190,58 Q 196,62 202,57" stroke="#0f172a" stroke-width="1.5" fill="none" />

        <!-- Over-Ear Studio Headphones -->
        <path d="M 155,50 Q 152,24 176,24 Q 195,24 195,42" fill="none" stroke="#6366f1" stroke-width="4" />
        <rect x="152" y="42" width="10" height="18" rx="4" fill="#2563eb" stroke="#f8fafc" stroke-width="1" filter="url(#proGlow)" />
        <circle cx="157" cy="51" r="2.5" fill="#38bdf8" />
      </g>
    </g>
  </g>
</svg>
