<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 135" width="100%" height="135">
  <defs>
    <!-- Background Track Gradient -->
    <linearGradient id="bgGradLtrBold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#040711" stop-opacity="0" />
      <stop offset="20%" stop-color="#070c18" stop-opacity="0.98" />
      <stop offset="80%" stop-color="#070c18" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#040711" stop-opacity="0" />
    </linearGradient>

    <!-- Bold Neon Circuit Track Glow -->
    <linearGradient id="trackGradLtrBold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2f81f7" stop-opacity="0" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="50%" stop-color="#2f81f7" stop-opacity="1" />
      <stop offset="75%" stop-color="#818cf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Bold Hoverboard Plasma Jet Stream -->
    <linearGradient id="jetPlasmaLtrBold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="boldGlowLtr" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes glideLtrBold {
        0% { transform: translateX(-380px); }
        100% { transform: translateX(1180px); }
      }
      @keyframes hoverBobLtrBold {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-6px) rotate(-1.2deg); }
      }
      @keyframes thrusterPulseLtrBold {
        0%, 100% { opacity: 0.85; transform: scaleX(1); }
        50% { opacity: 1; transform: scaleX(1.2); }
      }
      .drive-group-ltr-bold {
        animation: glideLtrBold 5.5s linear infinite;
      }
      .hover-group-ltr-bold {
        animation: hoverBobLtrBold 1.3s ease-in-out infinite;
      }
      .thruster-pulse-bold {
        animation: thrusterPulseLtrBold 0.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Track Base -->
  <rect x="0" y="10" width="1000" height="115" rx="10" fill="url(#bgGradLtrBold)" stroke="#21262d" stroke-width="1.5" />
  
  <!-- Bold Neon Circuit Ground Tracks -->
  <line x1="0" y1="110" x2="1000" y2="110" stroke="url(#trackGradLtrBold)" stroke-width="3" filter="url(#boldGlowLtr)" />
  <line x1="60" y1="118" x2="940" y2="118" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="16 10" opacity="0.6" />

  <!-- Speed Dust & Energy Nodes -->
  <circle cx="200" cy="110" r="3.5" fill="#38bdf8" filter="url(#boldGlowLtr)" />
  <circle cx="500" cy="110" r="4" fill="#2f81f7" filter="url(#boldGlowLtr)" />
  <circle cx="800" cy="110" r="3.5" fill="#c084fc" filter="url(#boldGlowLtr)" />

  <!-- ==================== BOLD ANIMATED HOVERBOARD CODER (LTR) ==================== -->
  <g class="drive-group-ltr-bold">
    <!-- Native SMIL Translation for High Compatibility -->
    <animateTransform attributeName="transform" type="translate" from="-380 0" to="1180 0" dur="5.5s" repeatCount="indefinite" />

    <!-- Jet Stream Behind Moving Hoverboard -->
    <path d="M -130,106 L 20,106" stroke="url(#jetPlasmaLtrBold)" stroke-width="6" filter="url(#boldGlowLtr)" class="thruster-pulse-bold" />
    <path d="M -90,100 L 25,100" stroke="url(#jetPlasmaLtrBold)" stroke-width="2.5" opacity="0.85" />
    <path d="M -100,112 L 15,112" stroke="url(#jetPlasmaLtrBold)" stroke-width="2.5" opacity="0.85" />

    <!-- Floating Hover Group (Bobbing up/down) -->
    <g class="hover-group-ltr-bold" transform="translate(0, 0)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="1.3s" repeatCount="indefinite" />

      <!-- ==================== BOLD FUTURISTIC HOVERBOARD ==================== -->
      <g transform="translate(25, 101)">
        <!-- Hoverboard Underglow -->
        <ellipse cx="10" cy="10" rx="48" ry="5" fill="#38bdf8" opacity="0.75" filter="url(#boldGlowLtr)" />

        <!-- Main Hoverboard Deck -->
        <rect x="-40" y="0" width="100" height="10" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" filter="url(#boldGlowLtr)" />
        
        <!-- Dual Plasma Thruster Rings -->
        <ellipse cx="-22" cy="5" rx="8" ry="3.5" fill="#38bdf8" />
        <ellipse cx="40" cy="5" rx="8" ry="3.5" fill="#c084fc" />
        <circle cx="-22" cy="5" r="2.5" fill="#ffffff" />
        <circle cx="40" cy="5" r="2.5" fill="#ffffff" />
        <line x1="-12" y1="5" x2="30" y2="5" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 2.5" />
      </g>

      <!-- ==================== BOLD CODER CHARACTER ==================== -->
      <g transform="translate(25, 18)">
        
        <!-- Legs in Stance -->
        <path d="M 14,65 L 8,83" stroke="#0f172a" stroke-width="7" stroke-linecap="round" />
        <path d="M 26,65 L 36,83" stroke="#0f172a" stroke-width="7" stroke-linecap="round" />
        <!-- Glowing Cyber Sneakers -->
        <rect x="2" y="81" width="15" height="6" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" />
        <rect x="32" y="81" width="15" height="6" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" />

        <!-- Bold Cyber Hoodie Jacket -->
        <path d="M 6,36 L 6,65 L 32,65 L 32,36 Z" fill="#1e293b" stroke="#2563eb" stroke-width="2" />
        <!-- Hoodie V-Neck & Zipper -->
        <polygon points="14,36 19,48 24,36" fill="#38bdf8" />
        <line x1="19" y1="48" x2="19" y2="65" stroke="#38bdf8" stroke-width="2" />

        <!-- Arms Typing on Laptop -->
        <path d="M 8,40 L -4,52 L 14,56" stroke="#1e293b" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 30,40 L 38,50 L 24,56" stroke="#1e293b" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

        <!-- Glowing Laptop with Streaming Code -->
        <g transform="translate(8, 45)">
          <rect x="-14" y="8" width="30" height="5" rx="2" fill="#334155" stroke="#64748b" stroke-width="1" />
          <polygon points="-12,8 -6,-6 16,-6 10,8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
          <line x1="-7" y1="-2" x2="10" y2="-2" stroke="#38bdf8" stroke-width="2" />
          <line x1="-5" y1="2" x2="8" y2="2" stroke="#00ea64" stroke-width="2" />
        </g>

        <!-- Head / Neck -->
        <rect x="16" y="30" width="6" height="7" fill="#fed7aa" />
        <circle cx="19" cy="22" r="11.5" fill="#fed7aa" stroke="#2f81f7" stroke-width="1.2" />

        <!-- Dark Hair -->
        <path d="M 8,20 C 7,10 12,6 19,6 C 26,6 30,10 30,18 C 26,14 21,13 15,15 C 10,16 9,18 8,20 Z" fill="#0f172a" />

        <!-- Bold Glowing Blue Cyber Headphones -->
        <path d="M 8,22 C 8,11 30,11 30,22" fill="none" stroke="#2563eb" stroke-width="3.5" />
        <rect x="5.5" y="17" width="5.5" height="10" rx="2.5" fill="#2563eb" stroke="#ffffff" stroke-width="0.8" filter="url(#boldGlowLtr)" />
        <rect x="28" y="17" width="5.5" height="10" rx="2.5" fill="#2563eb" stroke="#ffffff" stroke-width="0.8" filter="url(#boldGlowLtr)" />

        <!-- Smart Glasses -->
        <rect x="12" y="18.5" width="6.5" height="5.5" rx="1.8" fill="none" stroke="#38bdf8" stroke-width="1.5" />
        <rect x="20.5" y="18.5" width="6.5" height="5.5" rx="1.8" fill="none" stroke="#38bdf8" stroke-width="1.5" />
        <line x1="18.5" y1="21" x2="20.5" y2="21" stroke="#38bdf8" stroke-width="1.5" />

        <!-- Eyes & Smile -->
        <circle cx="15" cy="21.5" r="1.2" fill="#0f172a" />
        <circle cx="23.5" cy="21.5" r="1.2" fill="#0f172a" />
        <path d="M 16,27 Q 19,29.5 22,27" stroke="#9a3412" stroke-width="1.5" fill="none" stroke-linecap="round" />

      </g>
    </g>
  </g>
</svg>
