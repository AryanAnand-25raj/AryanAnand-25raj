<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="porscheClusterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0b1226" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>

    <!-- Chrome & Titanium Bezel -->
    <linearGradient id="titaniumBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="40%" stop-color="#64748b" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <linearGradient id="graphLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>

    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>

    <filter id="porscheHudGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="needleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes needleSweep {
      0% { transform: rotate(-120deg); }
      45% { transform: rotate(55deg); }
      60% { transform: rotate(40deg); }
      85% { transform: rotate(85deg); }
      100% { transform: rotate(-120deg); }
    }
    @keyframes scannerPulse {
      0% { transform: translateX(-150px); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateX(650px); opacity: 0; }
    }
    @keyframes blinkLed {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .porsche-needle {
      transform-origin: 100px 105px;
      animation: needleSweep 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .hud-scanner {
      animation: scannerPulse 3.5s linear infinite;
    }
    .gear-shift {
      animation: blinkLed 1.5s ease-in-out infinite;
    }
    .hud-font {
      font-family: 'Orbitron', 'Segoe UI', monospace;
    }
  </style>

  <!-- Main Bezel Frame -->
  <rect width="940" height="240" rx="16" fill="url(#porscheClusterBg)" stroke="#1e293b" stroke-width="2"/>
  <rect x="2" y="2" width="936" height="236" rx="14" fill="none" stroke="url(#titaniumBezel)" stroke-width="1" opacity="0.6"/>

  <!-- Top Cockpit Status Bar -->
  <rect x="0" y="0" width="940" height="38" rx="14" fill="#080e1e" stroke="#1e293b" stroke-width="1"/>
  <circle cx="28" cy="19" r="5" fill="#00f2fe" filter="url(#porscheHudGlow)"/>
  <circle cx="46" cy="19" r="5" fill="#6366f1"/>
  <circle cx="64" cy="19" r="5" fill="#ff007f"/>

  <text x="90" y="24" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="2" class="hud-font">
    PORSCHE 911 GT3 RS // SPORT CHRONO DIGITAL COCKPIT
  </text>
  <text x="910" y="24" fill="#00f2fe" font-size="11" font-weight="700" text-anchor="end" letter-spacing="1" class="hud-font">
    MODE: TRACK SPORT+ [MANUAL]
  </text>

  <!-- ==================== LEFT: PORSCHE SPORT CHRONO TACHOMETER ==================== -->
  <g transform="translate(30, 20)">
    <!-- Outer Chrome Ring -->
    <circle cx="100" cy="105" r="75" fill="#050811" stroke="#334155" stroke-width="3"/>
    <circle cx="100" cy="105" r="72" fill="#080e1c" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Tachometer Tick Scale (0 to 9000 RPM) -->
    <!-- Safe Zone (Cyan/White) -->
    <circle cx="100" cy="105" r="62" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="210 360" stroke-dashoffset="135" opacity="0.6"/>
    <!-- Redline Zone (Magenta 8k-9k) -->
    <circle cx="100" cy="105" r="62" fill="none" stroke="#ff007f" stroke-width="6" stroke-dasharray="45 360" stroke-dashoffset="-30" filter="url(#porscheHudGlow)"/>

    <!-- Digital Speed Readout in Center -->
    <text x="100" y="92" fill="#ffffff" font-size="22" font-weight="900" text-anchor="middle" class="hud-font">328</text>
    <text x="100" y="106" fill="#00f2fe" font-size="8" font-weight="700" text-anchor="middle" class="hud-font">KM / H</text>
    
    <!-- Gear Indicator -->
    <rect x="88" y="112" width="24" height="18" rx="4" fill="#020617" stroke="#ff007f" stroke-width="1.2"/>
    <text x="100" y="125" fill="#ff007f" font-size="12" font-weight="900" text-anchor="middle" class="hud-font gear-shift">7</text>

    <!-- Boost & G-Force Sub-readouts -->
    <text x="60" y="148" fill="#94a3b8" font-size="7" font-weight="700" class="hud-font">BOOST: 1.8 BAR</text>
    <text x="140" y="148" fill="#38bdf8" font-size="7" font-weight="700" text-anchor="end" class="hud-font">1.45 G</text>

    <!-- Realistic Animated Needle -->
    <g class="porsche-needle">
      <polygon points="98,105 102,105 100,42" fill="#ff007f" filter="url(#needleGlow)"/>
      <circle cx="100" cy="105" r="8" fill="#0f172a" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="100" cy="105" r="3" fill="#ff007f"/>
    </g>
  </g>

  <!-- ==================== RIGHT: AI TELEMETRY PERFORMANCE GRAPH ==================== -->
  <g transform="translate(250, 48)">
    <!-- Grid Box Background -->
    <rect x="0" y="0" width="655" height="165" rx="8" fill="rgba(6, 11, 24, 0.85)" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Grid Horizontal & Vertical Division Lines -->
    <g stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" opacity="0.6">
      <line x1="0" y1="35" x2="655" y2="35" />
      <line x1="0" y1="75" x2="655" y2="75" />
      <line x1="0" y1="115" x2="655" y2="115" />

      <line x1="95" y1="0" x2="95" y2="140" />
      <line x1="205" y1="0" x2="205" y2="140" />
      <line x1="315" y1="0" x2="315" y2="140" />
      <line x1="425" y1="0" x2="425" y2="140" />
      <line x1="535" y1="0" x2="535" y2="140" />
    </g>

    <!-- Day & Module Markers -->
    <g fill="#64748b" font-size="9" font-weight="700" class="hud-font">
      <text x="45" y="155" text-anchor="middle">MON // DEV</text>
      <text x="150" y="155" text-anchor="middle">TUE // ML</text>
      <text x="260" y="155" text-anchor="middle">WED // CLOUD</text>
      <text x="370" y="155" text-anchor="middle">THU // DEVOPS</text>
      <text x="480" y="155" text-anchor="middle">FRI // BUILD</text>
      <text x="590" y="155" text-anchor="middle">WEEKEND // TURBO</text>
    </g>

    <!-- Graph Shaded Area -->
    <path d="M 0,140 
             L 45,95 
             L 95,110 
             L 150,60 
             L 205,80 
             L 260,35 
             L 315,55 
             L 370,25 
             L 425,48 
             L 480,20 
             L 535,40 
             L 590,15 
             L 655,30 
             L 655,140 Z" 
          fill="url(#areaGrad)"/>

    <!-- High-Definition Performance Line -->
    <path d="M 0,140 
             L 45,95 
             L 95,110 
             L 150,60 
             L 205,80 
             L 260,35 
             L 315,55 
             L 370,25 
             L 425,48 
             L 480,20 
             L 535,40 
             L 590,15 
             L 655,30" 
          fill="none" 
          stroke="url(#graphLineGrad)" 
          stroke-width="3" 
          filter="url(#porscheHudGlow)"/>

    <!-- Data Node Points with Glow -->
    <circle cx="150" cy="60" r="4.5" fill="#ffffff" stroke="#00f2fe" stroke-width="2" filter="url(#porscheHudGlow)"/>
    <circle cx="260" cy="35" r="4.5" fill="#ffffff" stroke="#00f2fe" stroke-width="2" filter="url(#porscheHudGlow)"/>
    <circle cx="370" cy="25" r="5" fill="#ffffff" stroke="#6366f1" stroke-width="2" filter="url(#porscheHudGlow)"/>
    <circle cx="480" cy="20" r="5" fill="#ffffff" stroke="#ff007f" stroke-width="2" filter="url(#porscheHudGlow)"/>
    <circle cx="590" cy="15" r="5.5" fill="#ffffff" stroke="#ff007f" stroke-width="2.5" filter="url(#porscheHudGlow)"/>

    <!-- Laser Scanning Beam Sweeper -->
    <g class="hud-scanner">
      <line x1="0" y1="0" x2="0" y2="140" stroke="#00f2fe" stroke-width="2" filter="url(#porscheHudGlow)"/>
      <rect x="-30" y="0" width="30" height="140" fill="url(#areaGrad)"/>
    </g>

    <!-- Top Right Stats Indicator Tag -->
    <rect x="520" y="8" width="125" height="22" rx="4" fill="#080e1c" stroke="#00f2fe" stroke-width="1"/>
    <text x="582" y="23" fill="#00f2fe" font-size="9" font-weight="700" text-anchor="middle" class="hud-font">
      VELOCITY: 99.8%
    </text>
  </g>
</svg>
