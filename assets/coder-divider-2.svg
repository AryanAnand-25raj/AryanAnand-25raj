<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 120" width="100%" height="100%">
  <defs>
    <linearGradient id="divBgPro2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#070b14" stop-opacity="0" />
      <stop offset="20%" stop-color="#0d1527" stop-opacity="0.95" />
      <stop offset="80%" stop-color="#0d1527" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#070b14" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="streamGradPro2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <filter id="codeGlowPro2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseCardPro {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes lineFlowDashPro {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }
    .tech-card-glow {
      animation: pulseCardPro 2.5s ease-in-out infinite;
    }
    .data-flow-line {
      stroke-dasharray: 15 10;
      animation: lineFlowDashPro 0.7s linear infinite;
    }
    .code-label-font {
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 600;
    }
  </style>

  <!-- Container -->
  <rect width="920" height="120" rx="12" fill="url(#divBgPro2)" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Top & Bottom Rails -->
  <line x1="40" y1="18" x2="880" y2="18" stroke="url(#streamGradPro2)" stroke-width="1.4" opacity="0.75"/>
  <line x1="40" y1="102" x2="880" y2="102" stroke="url(#streamGradPro2)" stroke-width="1.4" opacity="0.75"/>

  <!-- Center Connecting Flow Line -->
  <line x1="60" y1="60" x2="860" y2="60" stroke="url(#streamGradPro2)" stroke-width="2.2" class="data-flow-line" filter="url(#codeGlowPro2)"/>

  <!-- Tech Pod Badges Floating in Stream -->
  <g class="tech-card-glow" transform="translate(140, 42)">
    <rect x="0" y="0" width="115" height="36" rx="8" fill="#0b1328" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="15" cy="18" r="4" fill="#38bdf8" />
    <text x="26" y="22" fill="#38bdf8" class="code-label-font">PYTHON // ML</text>
  </g>

  <g class="tech-card-glow" transform="translate(380, 42)" style="animation-delay: -0.8s;">
    <rect x="0" y="0" width="135" height="36" rx="8" fill="#0b1328" stroke="#60a5fa" stroke-width="1.2" />
    <circle cx="15" cy="18" r="4" fill="#60a5fa" />
    <text x="26" y="22" fill="#60a5fa" class="code-label-font">CLOUD // DEVOPS</text>
  </g>

  <g class="tech-card-glow" transform="translate(640, 42)" style="animation-delay: -1.6s;">
    <rect x="0" y="0" width="135" height="36" rx="8" fill="#0b1328" stroke="#818cf8" stroke-width="1.2" />
    <circle cx="15" cy="18" r="4" fill="#818cf8" />
    <text x="26" y="22" fill="#818cf8" class="code-label-font">WEB // FULL-STACK</text>
  </g>
</svg>
